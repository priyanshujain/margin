[package]
name = "objstore-gdrive"
description = "objstore backend for Google Drive, keys mapped onto folders inside one app folder"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono.workspace = true
objstore = { path = "../objstore" }
percent-encoding = "2"
rand.workspace = true
reqwest = { workspace = true, features = ["query"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
objstore-conformance = { path = "../objstore-conformance" }
tokio = { workspace = true, features = ["rt", "macros", "net"] }
url.workspace = true
