[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["apps", "crates/margin-proof/stubs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/priyanshujain/margin"

[workspace.dependencies]
margin-http = { path = "crates/margin-http" }
margin-oauth = { path = "crates/margin-oauth" }

tauri = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
url = "2"
chrono = "0.4"
tokio = { version = "1", features = ["sync", "time"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "json", "gzip", "http2"] }
rusqlite = { version = "0.40", features = ["bundled"] }
chacha20poly1305 = "0.11"
fontdb = "0.24"
tempfile = "3"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSError"] }
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow", "NSView", "NSControl", "NSButton"] }

# harper-core resolves an optional, disabled CUDA backend and an LLVM JIT runtime it never
# compiles. Empty stubs keep that subtree out of the graph. Apps that use margin-proof repeat this.
[patch.crates-io]
burn-cuda = { path = "crates/margin-proof/stubs/burn-cuda" }
cubecl-cpu = { path = "crates/margin-proof/stubs/cubecl-cpu" }
